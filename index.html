<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Minecraft</title>
    <style>
        :root {
            --bg: #1a1a2e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            height: 100vh;
            width: 100vw;
        }

        canvas {
            display: block;
        }

        #overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            pointer-events: all;
            background: rgba(0, 0, 0, 0.55);
            transition: opacity 0.5s;
        }
        #overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #overlay-box {
            background: #1e1e2e;
            border: 2px solid #444;
            border-radius: 20px;
            padding: 36px 40px;
            text-align: center;
            color: #ddd;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            max-width: 500px;
        }
        #overlay-box h1 {
            font-size: 2.2em;
            margin-bottom: 6px;
            letter-spacing: 2px;
            color: #7ec850;
            text-shadow: 0 0 30px #4a8;
        }
        #overlay-box .subtitle {
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 24px;
        }
        #overlay-box .btn {
            display: inline-block;
            padding: 14px 40px;
            font-size: 1.2em;
            background: #5a9e3e;
            color: #fff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            letter-spacing: 1px;
            font-weight: 600;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 6px 20px rgba(90, 158, 62, 0.4);
        }
        #overlay-box .btn:hover {
            background: #6ab84a;
            transform: scale(1.03);
        }
        #overlay-box .btn:active {
            transform: scale(0.96);
        }
        #overlay-box .keys {
            margin-top: 18px;
            font-size: 0.85em;
            color: #999;
            line-height: 1.8;
        }
        #overlay-box .keys span {
            display: inline-block;
            background: #333;
            color: #ccc;
            padding: 3px 8px;
            border-radius: 5px;
            margin: 0 2px;
            font-weight: 600;
            border: 1px solid #555;
            font-size: 0.9em;
        }

        #hud {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 5;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 28px;
            height: 28px;
        }
        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
        }
        #crosshair::before {
            width: 2px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
        }
        #crosshair::after {
            height: 2px;
            width: 100%;
            top: 50%;
            transform: translateY(-50%);
        }
        #block-indicator {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.9em;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.25);
        }
        #info {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.8em;
            letter-spacing: 0.5px;
            text-align: center;
            transition: opacity 0.5s;
        }
    </style>
</head>
<body>

    <div id="overlay">
        <div id="overlay-box">
            <h1>⛏ Mini Minecraft</h1>
            <p class="subtitle">A tiny voxel world in your browser</p>
            <button class="btn" id="play-btn">▶ PLAY NOW</button>
            <div class="keys">
                <span>W A S D</span> Move &nbsp;|&nbsp;
                <span>Space</span> Jump &nbsp;|&nbsp;
                <span>Mouse</span> Look<br>
                <span>Left Click</span> Break &nbsp;|&nbsp;
                <span>Right Click</span> Place<br>
                <span>1-7</span> or <span>Scroll</span> Change block &nbsp;|&nbsp;
                <span>Esc</span> Pause
            </div>
        </div>
    </div>

    <div id="hud">
        <div id="crosshair"></div>
        <div id="block-indicator">🟫 Dirt</div>
        <div id="info">Click to lock mouse · Esc to release</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ────────────────────────────────────
        // DOM ELEMENTS
        // ────────────────────────────────────
        const overlay = document.getElementById('overlay');
        const playBtn = document.getElementById('play-btn');
        const blockIndicator = document.getElementById('block-indicator');
        const infoEl = document.getElementById('info');
        const hud = document.getElementById('hud');

        // ────────────────────────────────────
        // CONSTANTS
        // ────────────────────────────────────
        const WORLD_HALF = 18; // world spans from -WORLD_HALF to +WORLD_HALF in x,z
        const REACH_DISTANCE = 7;
        const PLAYER_WIDTH = 0.6;
        const PLAYER_HEIGHT = 1.75;
        const PLAYER_EYE_HEIGHT = 1.55;
        const GRAVITY = 22;
        const JUMP_VELOCITY = 8.5;
        const MOVE_SPEED = 7;
        const MOUSE_SENSITIVITY = 0.002;

        const BLOCK_TYPES = [
            { name: 'Grass', color: 0x6b9b37, emoji: '🟩' },
            { name: 'Dirt', color: 0x8b5a2b, emoji: '🟫' },
            { name: 'Stone', color: 0x7f8c8d, emoji: '🪨' },
            { name: 'Sand', color: 0xe8d5a0, emoji: '🟨' },
            { name: 'Wood', color: 0xb08040, emoji: '🟤' },
            { name: 'Leaves', color: 0x3a7d20, emoji: '🌿' },
            { name: 'Planks', color: 0xc4945a, emoji: '🟧' },
        ];

        // ────────────────────────────────────
        // THREE.JS SETUP
        // ────────────────────────────────────
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;
        document.body.appendChild(renderer.domElement);

        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#87ceeb');
        scene.fog = new THREE.Fog('#b8ddf0', 20, 65);

        const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 10, 8);

        // Lighting
        const ambientLight = new THREE.AmbientLight('#bcd4f0', 1.8);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight('#fffef0', 4.5);
        sunLight.position.set(30, 50, 20);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 150;
        sunLight.shadow.camera.left = -30;
        sunLight.shadow.camera.right = 30;
        sunLight.shadow.camera.top = 30;
        sunLight.shadow.camera.bottom = -30;
        sunLight.shadow.bias = -0.0002;
        sunLight.shadow.normalBias = 0.02;
        scene.add(sunLight);

        const hemiLight = new THREE.HemisphereLight('#87ceeb', '#5a4a3a', 0.9);
        scene.add(hemiLight);

        // ────────────────────────────────────
        // BLOCK MANAGEMENT
        // ────────────────────────────────────
        const blockMeshes = []; // array of { x, y, z, typeIndex, mesh }
        const blockMap = new Map(); // key "x,y,z" -> block object

        const blocksGroup = new THREE.Group();
        scene.add(blocksGroup);

        const blockGeometry = new THREE.BoxGeometry(1, 1, 1);
        const materialCache = {};

        function getBlockMaterial(typeIndex) {
            if (!materialCache[typeIndex]) {
                materialCache[typeIndex] = new THREE.MeshStandardMaterial({
                    color: BLOCK_TYPES[typeIndex].color,
                    roughness: 0.75,
                    metalness: 0.05,
                });
            }
            return materialCache[typeIndex];
        }

        function addBlock(gx, gy, gz, typeIndex) {
            const key = `${gx},${gy},${gz}`;
            if (blockMap.has(key)) return false;

            const material = getBlockMaterial(typeIndex);
            const mesh = new THREE.Mesh(blockGeometry, material);
            mesh.position.set(gx, gy, gz);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mesh.userData = { gridX: gx, gridY: gy, gridZ: gz, typeIndex };

            blocksGroup.add(mesh);
            const blockObj = { x: gx, y: gy, z: gz, typeIndex, mesh };
            blockMeshes.push(blockObj);
            blockMap.set(key, blockObj);
            return true;
        }

        function removeBlock(gx, gy, gz) {
            const key = `${gx},${gy},${gz}`;
            const blockObj = blockMap.get(key);
            if (!blockObj) return false;

            blocksGroup.remove(blockObj.mesh);
            blockObj.mesh.geometry && blockObj.mesh.geometry !== blockGeometry && blockObj.mesh.geometry
        .dispose();
            blockMap.delete(key);
            const idx = blockMeshes.indexOf(blockObj);
            if (idx !== -1) blockMeshes.splice(idx, 1);
            return true;
        }

        function getBlockAt(gx, gy, gz) {
            return blockMap.get(`${gx},${gy},${gz}`) || null;
        }

        // ────────────────────────────────────
        // TERRAIN GENERATION
        // ────────────────────────────────────
        function noise2D(x, z) {
            const n = Math.sin(x * 12.9898 + z * 78.233) * 43758.5453;
            return n - Math.floor(n);
        }

        function smoothNoise(x, z) {
            const ix = Math.floor(x);
            const iz = Math.floor(z);
            const fx = x - ix;
            const fz = z - iz;
            const sx = fx * fx * (3 - 2 * fx);
            const sz = fz * fz * (3 - 2 * fz);
            const n00 = noise2D(ix, iz);
            const n10 = noise2D(ix + 1, iz);
            const n01 = noise2D(ix, iz + 1);
            const n11 = noise2D(ix + 1, iz + 1);
            const nx0 = n00 + (n10 - n00) * sx;
            const nx1 = n01 + (n11 - n01) * sx;
            return nx0 + (nx1 - nx0) * sz;
        }

        function getTerrainHeight(wx, wz) {
            let h = 5;
            h += smoothNoise(wx * 0.06, wz * 0.06) * 8;
            h += smoothNoise(wx * 0.14 + 3.7, wz * 0.14 + 1.2) * 4;
            h += smoothNoise(wx * 0.03, wz * 0.03) * 5;
            h += smoothNoise(wx * 0.25, wz * 0.25) * 2;
            h = Math.round(Math.max(1, Math.min(12, h)));
            return h;
        }

        function getBlockTypeForDepth(gx, gy, gz, surfaceHeight) {
            const depthFromSurface = surfaceHeight - 1 - gy;
            if (gy === surfaceHeight - 1) {
                // Surface block
                if (surfaceHeight <= 3) return 3; // Sand near water level
                return 0; // Grass
            }
            if (depthFromSurface <= 3 && surfaceHeight > 3) {
                return 1; // Dirt
            }
            return 2; // Stone
        }

        function generateTerrain() {
            // Clear existing
            while (blockMeshes.length > 0) {
                const b = blockMeshes[0];
                removeBlock(b.x, b.y, b.z);
            }

            for (let x = -WORLD_HALF; x <= WORLD_HALF; x++) {
                for (let z = -WORLD_HALF; z <= WORLD_HALF; z++) {
                    const height = getTerrainHeight(x, z);
                    for (let y = 0; y < height; y++) {
                        const typeIndex = getBlockTypeForDepth(x, y, z, height);
                        addBlock(x, y, z, typeIndex);
                    }
                }
            }

            // Add a few simple trees
            const treePositions = [];
            for (let i = 0; i < 35; i++) {
                const tx = Math.floor(Math.random() * (WORLD_HALF * 2 - 4)) - WORLD_HALF + 2;
                const tz = Math.floor(Math.random() * (WORLD_HALF * 2 - 4)) - WORLD_HALF + 2;
                const th = getTerrainHeight(tx, tz);
                if (th <= 3) continue; // no trees on sand
                const key = `${tx},${tz}`;
                if (treePositions.some(p => Math.abs(p[0] - tx) + Math.abs(p[1] - tz) < 5)) continue;
                treePositions.push([tx, tz]);

                // Trunk
                const trunkHeight = 3 + Math.floor(Math.random() * 3);
                for (let ty = th; ty < th + trunkHeight; ty++) {
                    addBlock(tx, ty, tz, 4); // Wood
                }
                // Leaves
                const leafBase = th + trunkHeight - 1;
                for (let dx = -2; dx <= 2; dx++) {
                    for (let dz = -2; dz <= 2; dz++) {
                        for (let dy = 0; dy <= 3; dy++) {
                            const dist = Math.abs(dx) + Math.abs(dz) + Math.abs(dy - 1);
                            if (dist <= 3 && Math.random() > 0.2) {
                                const lx = tx + dx;
                                const lz = tz + dz;
                                const ly = leafBase + dy;
                                if (!getBlockAt(lx, ly, lz)) {
                                    addBlock(lx, ly, lz, 5); // Leaves
                                }
                            }
                        }
                    }
                }
                // Ensure top leaves
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dz = -1; dz <= 1; dz++) {
                        const lx = tx + dx;
                        const lz = tz + dz;
                        const ly = leafBase + 3;
                        if (!getBlockAt(lx, ly, lz) && Math.abs(dx) + Math.abs(dz) <= 2) {
                            addBlock(lx, ly, lz, 5);
                        }
                    }
                }
            }
        }

        // ────────────────────────────────────
        // HIGHLIGHT WIREFRAME
        // ────────────────────────────────────
        const highlightGeo = new THREE.BoxGeometry(1.04, 1.04, 1.04);
        const highlightEdges = new THREE.EdgesGeometry(highlightGeo);
        const highlightLine = new THREE.LineSegments(
            highlightEdges,
            new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 1, depthTest: true, transparent: true,
                opacity: 0.7 })
        );
        highlightLine.visible = false;
        highlightLine.renderOrder = 1;
        highlightLine.material.depthTest = true;
        scene.add(highlightLine);

        // ────────────────────────────────────
        // PLAYER STATE
        // ────────────────────────────────────
        const player = {
            position: new THREE.Vector3(0, 8, 0),
            velocity: new THREE.Vector3(0, 0, 0),
            yaw: 0,
            pitch: -0.3,
            onGround: false,
        };
        let selectedBlockType = 1; // Default: Dirt

        // Find spawn position
        function findSpawnPoint() {
            const sx = 0;
            const sz = 0;
            const height = getTerrainHeight(sx, sz);
            return new THREE.Vector3(sx + 0.5, height + 0.5, sz + 0.5);
        }

        function respawnPlayer() {
            const spawn = findSpawnPoint();
            player.position.copy(spawn);
            player.position.y = Math.max(player.position.y, getTerrainHeight(
                Math.round(player.position.x),
                Math.round(player.position.z)
            ) + 2);
            player.velocity.set(0, 0, 0);
            player.yaw = 0;
            player.pitch = -0.3;
            player.onGround = false;
        }

        // ────────────────────────────────────
        // COLLISION DETECTION
        // ────────────────────────────────────
        function playerAABB(pos) {
            return {
                min: new THREE.Vector3(pos.x - PLAYER_WIDTH / 2, pos.y, pos.z - PLAYER_WIDTH / 2),
                max: new THREE.Vector3(pos.x + PLAYER_WIDTH / 2, pos.y + PLAYER_HEIGHT, pos.z + PLAYER_WIDTH / 2),
            };
        }

        function blockAABB(bx, by, bz) {
            return {
                min: new THREE.Vector3(bx - 0.5, by - 0.5, bz - 0.5),
                max: new THREE.Vector3(bx + 0.5, by + 0.5, bz + 0.5),
            };
        }

        function aabbOverlap(a, b) {
            return (
                a.min.x < b.max.x && a.max.x > b.min.x &&
                a.min.y < b.max.y && a.max.y > b.min.y &&
                a.min.z < b.max.z && a.max.z > b.min.z
            );
        }

        function getNearbyBlocks(pos, radius) {
            const blocks = [];
            const minX = Math.floor(pos.x - radius);
            const maxX = Math.ceil(pos.x + radius);
            const minY = Math.floor(pos.y - radius);
            const maxY = Math.ceil(pos.y + PLAYER_HEIGHT + radius);
            const minZ = Math.floor(pos.z - radius);
            const maxZ = Math.ceil(pos.z + radius);
            for (let x = minX; x <= maxX; x++) {
                for (let y = minY; y <= maxY; y++) {
                    for (let z = minZ; z <= maxZ; z++) {
                        const block = getBlockAt(x, y, z);
                        if (block) blocks.push(block);
                    }
                }
            }
            return blocks;
        }

        function checkCollisionAt(pos) {
            const pAABB = playerAABB(pos);
            const nearby = getNearbyBlocks(pos, 1.5);
            for (const block of nearby) {
                const bAABB = blockAABB(block.x, block.y, block.z);
                if (aabbOverlap(pAABB, bAABB)) {
                    return true;
                }
            }
            return false;
        }

        function resolveCollision(pos, velocity) {
            const pAABB = playerAABB(pos);
            const nearby = getNearbyBlocks(pos, 1.5);
            let resolvedY = pos.y;
            let resolvedX = pos.x;
            let resolvedZ = pos.z;
            let landed = false;
            let hitCeiling = false;

            // Resolve Y
            for (const block of nearby) {
                const bAABB = blockAABB(block.x, block.y, block.z);
                if (
                    pAABB.min.x < bAABB.max.x && pAABB.max.x > bAABB.min.x &&
                    pAABB.min.z < bAABB.max.z && pAABB.max.z > bAABB.min.z
                ) {
                    if (velocity.y <= 0 && pAABB.min.y < bAABB.max.y && pAABB.max.y > bAABB.min.y) {
                        // Landing on top of block
                        const overlap = bAABB.max.y - pAABB.min.y;
                        if (overlap > 0 && overlap < PLAYER_HEIGHT + 0.5) {
                            resolvedY = Math.max(resolvedY, bAABB.max.y);
                            landed = true;
                        }
                    }
                    if (velocity.y > 0 && pAABB.max.y > bAABB.min.y && pAABB.min.y < bAABB.max.y) {
                        // Hitting ceiling
                        const overlap = pAABB.max.y - bAABB.min.y;
                        if (overlap > 0 && overlap < PLAYER_HEIGHT + 0.5) {
                            resolvedY = Math.min(resolvedY, bAABB.min.y - PLAYER_HEIGHT);
                            hitCeiling = true;
                        }
                    }
                }
            }

            // Update for X/Z resolution
            const updatedPos = new THREE.Vector3(resolvedX, resolvedY, resolvedZ);
            const updatedAABB = playerAABB(updatedPos);

            // Resolve X
            for (const block of nearby) {
                const bAABB = blockAABB(block.x, block.y, block.z);
                if (
                    updatedAABB.min.y < bAABB.max.y && updatedAABB.max.y > bAABB.min.y &&
                    updatedAABB.min.z < bAABB.max.z && updatedAABB.max.z > bAABB.min.z
                ) {
                    if (velocity.x > 0 && updatedAABB.max.x > bAABB.min.x && updatedAABB.min.x < bAABB.min.x) {
                        resolvedX = bAABB.min.x - PLAYER_WIDTH / 2;
                    }
                    if (velocity.x < 0 && updatedAABB.min.x < bAABB.max.x && updatedAABB.max.x > bAABB.max.x) {
                        resolvedX = bAABB.max.x + PLAYER_WIDTH / 2;
                    }
                }
            }

            // Resolve Z
            const updatedPos2 = new THREE.Vector3(resolvedX, resolvedY, resolvedZ);
            const updatedAABB2 = playerAABB(updatedPos2);
            for (const block of nearby) {
                const bAABB = blockAABB(block.x, block.y, block.z);
                if (
                    updatedAABB2.min.y < bAABB.max.y && updatedAABB2.max.y > bAABB.min.y &&
                    updatedAABB2.min.x < bAABB.max.x && updatedAABB2.max.x > bAABB.min.x
                ) {
                    if (velocity.z > 0 && updatedAABB2.max.z > bAABB.min.z && updatedAABB2.min.z < bAABB.min.z) {
                        resolvedZ = bAABB.min.z - PLAYER_WIDTH / 2;
                    }
                    if (velocity.z < 0 && updatedAABB2.min.z < bAABB.max.z && updatedAABB2.max.z > bAABB.max.z) {
                        resolvedZ = bAABB.max.z + PLAYER_WIDTH / 2;
                    }
                }
            }

            return {
                position: new THREE.Vector3(resolvedX, resolvedY, resolvedZ),
                landed,
                hitCeiling,
            };
        }

        // ────────────────────────────────────
        // RAYCASTING
        // ────────────────────────────────────
        const raycaster = new THREE.Raycaster();
        raycaster.far = REACH_DISTANCE + 1;

        function getTargetedBlock() {
            const direction = new THREE.Vector3(0, 0, -1);
            direction.applyQuaternion(camera.quaternion);
            raycaster.set(camera.position, direction);
            raycaster.far = REACH_DISTANCE;
            const meshes = blockMeshes.map(b => b.mesh);
            const intersections = raycaster.intersectObjects(meshes, false);
            if (intersections.length > 0) {
                const hit = intersections[0];
                const mesh = hit.object;
                const gridPos = new THREE.Vector3(
                    Math.round(mesh.position.x),
                    Math.round(mesh.position.y),
                    Math.round(mesh.position.z)
                );
                const normal = hit.face.normal.clone();
                // Transform normal to world space (blocks aren't rotated so this is identity)
                normal.round();
                return {
                    blockObj: getBlockAt(gridPos.x, gridPos.y, gridPos.z),
                    gridPos,
                    normal,
                    distance: hit.distance,
                };
            }
            return null;
        }

        // ────────────────────────────────────
        // INPUT HANDLING
        // ────────────────────────────────────
        const keys = {};
        let pointerLocked = false;

        document.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            // Number keys for block selection
            if (e.code >= 'Digit1' && e.code <= 'Digit7') {
                const idx = parseInt(e.code.replace('Digit', '')) - 1;
                if (idx >= 0 && idx < BLOCK_TYPES.length) {
                    selectedBlockType = idx;
                    updateBlockIndicator();
                }
            }
            if (e.code === 'KeyR') {
                respawnPlayer();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        document.addEventListener('mousemove', (e) => {
            if (!pointerLocked) return;
            player.yaw -= e.movementX * MOUSE_SENSITIVITY;
            player.pitch -= e.movementY * MOUSE_SENSITIVITY;
            player.pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, player.pitch));
        });

        document.addEventListener('mousedown', (e) => {
            if (!pointerLocked) return;
            const target = getTargetedBlock();
            if (e.button === 0 && target && target.blockObj) {
                // Left click - break block
                removeBlock(target.gridPos.x, target.gridPos.y, target.gridPos.z);
            }
            if (e.button === 2 && target) {
                // Right click - place block
                const newPos = target.gridPos.clone().add(target.normal);
                const nx = Math.round(newPos.x);
                const ny = Math.round(newPos.y);
                const nz = Math.round(newPos.z);
                // Don't place if it overlaps the player
                const newBlockAABB = blockAABB(nx, ny, nz);
                const pAABB = playerAABB(player.position);
                if (!aabbOverlap(pAABB, newBlockAABB) && !getBlockAt(nx, ny, nz)) {
                    addBlock(nx, ny, nz, selectedBlockType);
                }
            }
        });

        document.addEventListener('contextmenu', (e) => e.preventDefault());

        document.addEventListener('wheel', (e) => {
            if (!pointerLocked) return;
            e.preventDefault();
            if (e.deltaY > 0) {
                selectedBlockType = (selectedBlockType + 1) % BLOCK_TYPES.length;
            } else {
                selectedBlockType = (selectedBlockType - 1 + BLOCK_TYPES.length) % BLOCK_TYPES.length;
            }
            updateBlockIndicator();
        }, { passive: false });

        function updateBlockIndicator() {
            const bt = BLOCK_TYPES[selectedBlockType];
            blockIndicator.textContent = `${bt.emoji} ${bt.name}`;
        }

        // Pointer lock
        function requestPointerLock() {
            renderer.domElement.requestPointerLock();
        }

        document.addEventListener('pointerlockchange', () => {
            pointerLocked = document.pointerLockElement === renderer.domElement;
            if (pointerLocked) {
                overlay.classList.add('hidden');
                infoEl.style.opacity = '0';
                hud.style.display = 'block';
            } else {
                overlay.classList.remove('hidden');
                infoEl.style.opacity = '1';
                hud.style.display = 'block';
            }
        });

        playBtn.addEventListener('click', () => {
            requestPointerLock();
        });

        renderer.domElement.addEventListener('click', () => {
            if (!pointerLocked) {
                requestPointerLock();
            }
        });

        // ────────────────────────────────────
        // GAME LOOP
        // ────────────────────────────────────
        const clock = new THREE.Clock();
        let lastTargetBlockPos = null;

        function updateCamera() {
            const euler = new THREE.Euler(player.pitch, player.yaw, 0, 'YXZ');
            camera.quaternion.setFromEuler(euler);
            camera.position.set(
                player.position.x,
                player.position.y + PLAYER_EYE_HEIGHT,
                player.position.z
            );
        }

        function update(dt) {
            if (!pointerLocked) {
                // Still update camera for preview
                updateCamera();
                return;
            }

            // Cap dt to prevent physics explosions
            const cappedDt = Math.min(dt, 0.15);

            // Input direction
            const forward = new THREE.Vector3(0, 0, -1);
            forward.applyQuaternion(camera.quaternion);
            forward.y = 0;
            forward.normalize();
            const right = new THREE.Vector3(1, 0, 0);
            right.applyQuaternion(camera.quaternion);
            right.y = 0;
            right.normalize();

            const moveDir = new THREE.Vector3(0, 0, 0);
            if (keys['KeyW']) moveDir.add(forward);
            if (keys['KeyS']) moveDir.sub(forward);
            if (keys['KeyA']) moveDir.sub(right);
            if (keys['KeyD']) moveDir.add(right);
            if (moveDir.length() > 1) moveDir.normalize();

            // Apply horizontal movement
            const hSpeed = MOVE_SPEED;
            player.velocity.x = moveDir.x * hSpeed;
            player.velocity.z = moveDir.z * hSpeed;

            // Jumping
            if (keys['Space'] && player.onGround) {
                player.velocity.y = JUMP_VELOCITY;
                player.onGround = false;
            }

            // Gravity
            if (!player.onGround) {
                player.velocity.y -= GRAVITY * cappedDt;
            } else {
                player.velocity.y = Math.min(player.velocity.y, 0);
            }

            // Proposed new position
            const proposedPos = player.position.clone();
            proposedPos.x += player.velocity.x * cappedDt;
            proposedPos.y += player.velocity.y * cappedDt;
            proposedPos.z += player.velocity.z * cappedDt;

            // Resolve collisions
            const result = resolveCollision(proposedPos, player.velocity);
            player.position.copy(result.position);
            player.onGround = result.landed;
            if (result.landed && player.velocity.y < 0) {
                player.velocity.y = 0;
            }
            if (result.hitCeiling && player.velocity.y > 0) {
                player.velocity.y = 0;
            }

            // Check if still on ground (block directly below)
            if (!player.onGround) {
                const belowPos = player.position.clone();
                belowPos.y -= 0.05;
                if (checkCollisionAt(belowPos)) {
                    player.onGround = true;
                    player.velocity.y = 0;
                    // Snap to ground
                    const nearby = getNearbyBlocks(player.position, 1.5);
                    for (const block of nearby) {
                        const bAABB = blockAABB(block.x, block.y, block.z);
                        const pAABB = playerAABB(player.position);
                        if (
                            pAABB.min.x < bAABB.max.x && pAABB.max.x > bAABB.min.x &&
                            pAABB.min.z < bAABB.max.z && pAABB.max.z > bAABB.min.z
                        ) {
                            if (Math.abs(pAABB.min.y - bAABB.max.y) < 0.3 && pAABB.min.y >= bAABB.max.y - 0.1) {
                                player.position.y = bAABB.max.y;
                                player.onGround = true;
                                player.velocity.y = 0;
                                break;
                            }
                        }
                    }
                }
            }

            // Fall below world
            if (player.position.y < -20) {
                respawnPlayer();
            }

            // Clamp to world bounds
            player.position.x = Math.max(-WORLD_HALF, Math.min(WORLD_HALF, player.position.x));
            player.position.z = Math.max(-WORLD_HALF, Math.min(WORLD_HALF, player.position.z));

            // Update camera
            updateCamera();

            // Highlight targeted block
            const target = getTargetedBlock();
            if (target && target.blockObj) {
                highlightLine.position.copy(target.gridPos);
                highlightLine.visible = true;
                lastTargetBlockPos = target.gridPos.clone();
            } else {
                highlightLine.visible = false;
                lastTargetBlockPos = null;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();
            update(dt);
            renderer.render(scene, camera);
        }

        // ────────────────────────────────────
        // RESIZE HANDLER
        // ────────────────────────────────────
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ────────────────────────────────────
        // INITIALIZATION
        // ────────────────────────────────────
        function init() {
            generateTerrain();
            respawnPlayer();
            updateCamera();
            updateBlockIndicator();
            // Set initial camera position before pointer lock
            camera.position.set(
                player.position.x,
                player.position.y + PLAYER_EYE_HEIGHT,
                player.position.z
            );
            const euler = new THREE.Euler(player.pitch, player.yaw, 0, 'YXZ');
            camera.quaternion.setFromEuler(euler);
        }

        init();
        animate();

        console.log('⛏️  Mini Minecraft ready!');
        console.log('  Click the screen to lock the mouse and start playing.');
        console.log('  WASD = Move | Space = Jump | Left Click = Break | Right Click = Place');
        console.log('  1-7 or Scroll = Change block type | Esc = Release mouse');
        console.log('  R = Respawn');
        console.log(`  World size: ${WORLD_HALF*2+1}x${WORLD_HALF*2+1} | Blocks: ~${blockMeshes.length}`);
    </script>
</body>
</html>
