<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide Explainer · Beginner Friendly</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --primary: #4f6ef7;
      --primary-hover: #3b55d1;
      --surface: #ffffff;
      --background: #f4f6fb;
      --text: #1a1f36;
      --text-secondary: #5f677a;
      --border: #e2e5f1;
      --radius: 16px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--background);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app-container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      text-align: left;
    }

    .header-text h1 {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }

    .header-text .subtitle {
      color: var(--text-secondary);
      font-size: 0.95rem;
    }

    .api-key-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      background: #fafbfd;
    }

    .api-key-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
      background: #f5f7ff;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 20px;
    }

    .input-group label {
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
    }

    .textarea-field {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 0.95rem;
      background: #fafbfd;
      transition: all 0.2s ease;
      font-family: inherit;
      min-height: 120px;
      resize: vertical;
    }

    .textarea-field:focus {
      border-color: var(--primary);
      background: white;
      outline: none;
      box-shadow: 0 0 0 4px rgba(79,110,247,0.12);
    }

    .file-upload-area {
      border: 2px dashed var(--border);
      border-radius: 14px;
      padding: 32px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: #fafbfd;
    }

    .file-upload-area:hover {
      border-color: var(--primary);
      background: rgba(79,110,247,0.03);
    }

    .file-upload-area.dragover {
      border-color: var(--primary);
      background: rgba(79,110,247,0.08);
    }

    .file-upload-area .icon { font-size: 2.2rem; margin-bottom: 8px; }
    .file-upload-area .main-text { font-weight: 600; font-size: 0.95rem; }
    .file-upload-area .hint { color: var(--text-secondary); font-size: 0.8rem; margin-top: 6px; }

    .preview-section {
      margin-top: 16px;
      text-align: center;
      display: none;
    }

    .preview-section img {
      max-width: 100%;
      max-height: 280px;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      object-fit: contain;
    }

    .page-selector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 14px;
      font-size: 0.9rem;
    }

    .page-selector select {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: white;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 16px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 14px rgba(79,110,247,0.35);
      margin-top: 8px;
    }

    .btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(79,110,247,0.4);
    }

    .btn:disabled {
      background: #c0c7e0;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    .loading-state {
      display: none;
      text-align: center;
      padding: 20px;
      font-size: 0.95rem;
      color: var(--text-secondary);
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid var(--border);
      border-top: 3px solid var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 10px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-message {
      color: #d92c2c;
      font-weight: 500;
      margin-top: 12px;
      display: none;
      background: #fff5f5;
      padding: 12px 16px;
      border-radius: 10px;
      border-left: 4px solid #d92c2c;
    }

    .explanation-box {
      display: none;
      background: #f5f8ff;
      border-radius: var(--radius);
      padding: 24px;
      border-left: 6px solid var(--primary);
      line-height: 1.7;
      font-size: 1rem;
      white-space: pre-wrap;
      box-shadow: var(--shadow-sm);
    }

    .small-note {
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* Modal overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      visibility: hidden;
      opacity: 0;
      transition: all 0.25s ease;
    }

    .modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .modal {
      background: white;
      border-radius: 20px;
      padding: 32px;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.25);
      text-align: center;
    }

    .modal h2 {
      margin-bottom: 8px;
      font-size: 1.5rem;
    }

    .modal p {
      color: var(--text-secondary);
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    .modal input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: 12px;
      font-size: 0.95rem;
      margin-bottom: 16px;
      text-align: center;
    }

    .modal .btn {
      margin-top: 0;
    }

    .modal .close-link {
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.85rem;
      margin-top: 12px;
      display: inline-block;
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .card { padding: 20px; }
      .header { flex-direction: column; align-items: flex-start; gap: 12px; }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Header with API key button -->
    <div class="card header">
      <div class="header-text">
        <h1>📘 Lecture Slide Explainer</h1>
        <p class="subtitle">Upload a slide or paste text — get a super simple explanation</p>
      </div>
      <button class="api-key-btn" id="showApiKeyModal">
        🔑 <span id="apiKeyStatus">Set API Key</span>
      </button>
    </div>

    <!-- Main input card -->
    <div class="card">
      <div class="input-group">
        <label>📁 Upload Slide (Image or PDF)</label>
        <div class="file-upload-area" id="dropZone">
          <div class="icon">📂</div>
          <div class="main-text">Click to browse or drag & drop</div>
          <div class="hint">Supports PNG, JPG, and PDF files</div>
          <input type="file" id="fileInput" accept="image/*,.pdf" hidden>
        </div>
        <div class="preview-section" id="previewContainer">
          <img id="previewImg" alt="Slide preview">
          <div class="page-selector">
            <span>Page:</span>
            <select id="pageSelect"></select>
            <span class="small-note" id="pageCount"></span>
          </div>
        </div>
      </div>

      <div class="input-group">
        <label>📝 Paste or edit slide text</label>
        <textarea id="slideText" class="textarea-field" placeholder="The slide text will appear here if you upload a PDF, or you can type/paste it manually..."></textarea>
      </div>

      <button id="explainBtn" class="btn">✨ Explain This Slide</button>
      <div class="loading-state" id="loadingDiv">
        <div class="spinner"></div> Thinking...
      </div>
      <div class="error-message" id="errorDiv"></div>
    </div>

    <div class="explanation-box" id="explanationDiv"></div>
  </div>

  <!-- API Key Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2>🔑 Enter Gemini API Key</h2>
      <p>Get a free key at <a href="https://aistudio.google.com/" target="_blank">Google AI Studio</a><br>(1,500 requests/day free)</p>
      <input type="password" id="modalApiKey" placeholder="Paste your API key here" autocomplete="off">
      <button class="btn" id="saveApiKeyBtn">Save Key</button>
      <div class="close-link" id="closeModal">Cancel</div>
    </div>
  </div>

  <script>
    (function() {
      // ──────────────────────────────────────
      // DOM references
      // ──────────────────────────────────────
      const slideText = document.getElementById('slideText');
      const fileInput = document.getElementById('fileInput');
      const dropZone = document.getElementById('dropZone');
      const previewContainer = document.getElementById('previewContainer');
      const previewImg = document.getElementById('previewImg');
      const pageSelect = document.getElementById('pageSelect');
      const pageCount = document.getElementById('pageCount');
      const explainBtn = document.getElementById('explainBtn');
      const loadingDiv = document.getElementById('loadingDiv');
      const errorDiv = document.getElementById('errorDiv');
      const explanationDiv = document.getElementById('explanationDiv');
      const showApiKeyModalBtn = document.getElementById('showApiKeyModal');
      const apiKeyStatus = document.getElementById('apiKeyStatus');
      const modalOverlay = document.getElementById('modalOverlay');
      const modalApiKeyInput = document.getElementById('modalApiKey');
      const saveApiKeyBtn = document.getElementById('saveApiKeyBtn');
      const closeModal = document.getElementById('closeModal');

      // ──────────────────────────────────────
      // State
      // ──────────────────────────────────────
      let currentApiKey = '';          // stored in memory only
      let currentFile = null;
      let selectedImageBase64 = null;
      let pdfDoc = null;
      let currentPageNum = 1;
      let extractedTextCache = {};

      // ──────────────────────────────────────
      // API Key modal management
      // ──────────────────────────────────────
      function openModal() {
        modalApiKeyInput.value = '';
        modalOverlay.classList.add('active');
        setTimeout(() => modalApiKeyInput.focus(), 100);
      }

      function closeModalWindow() {
        modalOverlay.classList.remove('active');
      }

      function saveApiKey() {
        const key = modalApiKeyInput.value.trim();
        if (key) {
          currentApiKey = key;
          apiKeyStatus.textContent = 'Key set ✓';
          showApiKeyModalBtn.style.borderColor = 'var(--primary)';
          showApiKeyModalBtn.style.color = 'var(--primary)';
          closeModalWindow();
        } else {
          alert('Please enter a valid API key.');
        }
      }

      showApiKeyModalBtn.addEventListener('click', openModal);
      closeModal.addEventListener('click', closeModalWindow);
      saveApiKeyBtn.addEventListener('click', saveApiKey);
      modalOverlay.addEventListener('click', (e) => {
        if (e.target === modalOverlay) closeModalWindow();
      });

      // Ask for key on first load if none set
      window.addEventListener('load', () => {
        if (!currentApiKey) openModal();
      });

      // ──────────────────────────────────────
      // File handling
      // ──────────────────────────────────────
      dropZone.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) handleFile(e.target.files[0]);
      });

      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      });
      dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
      });

      function handleFile(file) {
        currentFile = file;
        pdfDoc = null;
        extractedTextCache = {};
        currentPageNum = 1;
        pageSelect.innerHTML = '';
        previewContainer.style.display = 'none';
        selectedImageBase64 = null;
        errorDiv.style.display = 'none';

        if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = () => {
            selectedImageBase64 = reader.result.split(',')[1];
            previewImg.src = reader.result;
            previewContainer.style.display = 'block';
            pageCount.textContent = '';
          };
          reader.readAsDataURL(file);
        } else if (file.type === 'application/pdf' || file.name.endsWith('.pdf')) {
          loadPDF(file);
        } else {
          showError('Unsupported file type. Please use an image (PNG/JPG) or PDF.');
          currentFile = null;
        }
      }

      async function loadPDF(file) {
        try {
          const arrayBuffer = await file.arrayBuffer();
          const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
          pdfDoc = await loadingTask.promise;
          const numPages = pdfDoc.numPages;
          pageCount.textContent = `of ${numPages}`;

          pageSelect.innerHTML = '';
          for (let i = 1; i <= numPages; i++) {
            const option = document.createElement('option');
            option.value = i;
            option.textContent = `Page ${i}`;
            pageSelect.appendChild(option);
          }
          pageSelect.value = 1;
          previewContainer.style.display = 'block';
          await renderPage(1);
        } catch (err) {
          showError('Failed to load PDF. Make sure it is a valid PDF file.');
          console.error(err);
        }
      }

      pageSelect.addEventListener('change', async () => {
        const pageNum = parseInt(pageSelect.value);
        if (pageNum !== currentPageNum && pdfDoc) {
          await renderPage(pageNum);
        }
      });

      async function renderPage(pageNum) {
        if (!pdfDoc) return;
        try {
          const page = await pdfDoc.getPage(pageNum);
          const viewport = page.getViewport({ scale: 1.5 });
          const canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          const ctx = canvas.getContext('2d');
          await page.render({ canvasContext: ctx, viewport }).promise;

          selectedImageBase64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
          previewImg.src = canvas.toDataURL('image/jpeg', 0.85);

          if (!extractedTextCache[pageNum]) {
            const textContent = await page.getTextContent();
            const text = textContent.items.map(item => item.str).join(' ');
            extractedTextCache[pageNum] = text;
          }
          if (!slideText.value.trim()) {
            slideText.value = extractedTextCache[pageNum] || '';
          }
          currentPageNum = pageNum;
        } catch (err) {
          showError('Error rendering PDF page.');
          console.error(err);
        }
      }

      // ──────────────────────────────────────
      // Explanation logic
      // ──────────────────────────────────────
      explainBtn.addEventListener('click', async () => {
        if (!currentApiKey) {
          openModal();
          showError('Please set your Gemini API key first.');
          return;
        }
        if (!slideText.value.trim() && !selectedImageBase64) {
          showError('Please upload a slide or paste text.');
          return;
        }

        errorDiv.style.display = 'none';
        explanationDiv.style.display = 'none';
        loadingDiv.style.display = 'block';
        explainBtn.disabled = true;

        try {
          const explanation = await callGemini(currentApiKey);
          explanationDiv.textContent = explanation;
          explanationDiv.style.display = 'block';
        } catch (err) {
          showError(err.message || 'Something went wrong. Check your API key and try again.');
        } finally {
          loadingDiv.style.display = 'none';
          explainBtn.disabled = false;
        }
      });

      async function callGemini(apiKey) {
        const baseUrl = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent';
        const url = `${baseUrl}?key=${apiKey}`;

        const parts = [];
        const systemPrompt = "You are a patient and friendly teacher. Explain the following lecture slide in the simplest possible way, as if the reader has never heard of the topic before. Use everyday language, analogies if helpful, and break down complex ideas step by step. Keep it concise but clear and encouraging.";

        if (selectedImageBase64) {
          parts.push({
            inline_data: {
              mimeType: "image/jpeg",
              data: selectedImageBase64
            }
          });
        }

        const combinedText = slideText.value.trim();
        if (combinedText) {
          parts.push({ text: `${systemPrompt}\n\nSlide text:\n${combinedText}` });
        } else if (selectedImageBase64) {
          parts.push({ text: `${systemPrompt}\n\n[Explain the slide image above]` });
        }

        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts }],
            generationConfig: { temperature: 0.2, maxOutputTokens: 800 }
          })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error?.message || `API error (${response.status})`);
        }
        return data.candidates?.[0]?.content?.parts?.[0]?.text || 'No explanation generated.';
      }

      function showError(msg) {
        errorDiv.textContent = '❌ ' + msg;
        errorDiv.style.display = 'block';
      }
    })();
  </script>
</body>
</html>
